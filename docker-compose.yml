version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deposito_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: deposito_fortuna
      POSTGRES_USER: deposito_admin
      POSTGRES_PASSWORD: deposito_2026_secure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: deposito_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
